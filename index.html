<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de Formulário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Cadastro</h1>

    <input type="text" id="nome" placeholder="Nome" oninput="validarFormulario()">

    <input type="email" id="email" placeholder="Email" oninput="validarFormulario()">

    <input type="password" id="senha" placeholder="Senha" oninput="validarFormulario()">

    <input type="password" id="confirmarSenha" placeholder="Confirmar Senha" oninput="validarFormulario()">

    <p id="mensagem"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
